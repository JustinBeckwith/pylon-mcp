on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (leave empty to use package.json version)'
        required: false
        type: string
name: publish-mcp
permissions: {}
env:
  MCP_PUBLISHER_VERSION: v1.5.0
  MCP_PUBLISHER_LINUX_AMD64_SHA256: 79bbb73ba048c5906034f73ef6286d7763bd53cf368ea0b358fc593ed360cbd5
  MCP_PUBLISHER_LINUX_ARM64_SHA256: ba33c656a3fe79e9e01395cc367641cb3847dc9990d299bde3fbcc13c0f830d0
jobs:
  publish-mcp:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@26f6d4f2c533a43e6b5da0b4a5dd983f98f7b49a # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run validate:mcp
      - name: Install MCP Publisher
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64)
              arch=amd64
              checksum="$MCP_PUBLISHER_LINUX_AMD64_SHA256"
              ;;
            aarch64|arm64)
              arch=arm64
              checksum="$MCP_PUBLISHER_LINUX_ARM64_SHA256"
              ;;
            *)
              echo "Unsupported architecture: $(uname -m)" >&2
              exit 1
              ;;
          esac
          archive="mcp-publisher_linux_${arch}.tar.gz"
          curl -fsSLo "$archive" "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/${archive}"
          echo "${checksum}  ${archive}" | sha256sum -c -
          tar -xzf "$archive"
          sudo install -m 0755 mcp-publisher /usr/local/bin/mcp-publisher
      - name: Login to MCP Registry
        run: mcp-publisher login github-oidc
      - name: Publish to MCP Registry
        run: mcp-publisher publish
